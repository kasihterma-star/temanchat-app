<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6555"><meta name="robots" content="noindex">
<title>Masuk • TemanChat</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/auth.css?v=6.1">
<style>
#authForm[hidden],#tabs[hidden],#passwordGroup[hidden],#emailGroup[hidden],#registerFields[hidden],#registerSuccess[hidden],.extras button[hidden]{display:none!important}
.tc-success{display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;padding:20px 4px}
.tc-success h2{color:#066653;font-size:22px;margin:0}.tc-success p{margin:0;line-height:1.65;font-size:14px;color:#56776d}
.tc-success .mail-icon{background:#d9f5e9;width:65px;height:65px;border-radius:50%;display:grid;place-items:center;font-size:29px}
.tc-success strong{overflow-wrap:anywhere;color:#065b4d}.tc-success button{width:100%;border:0;padding:14px;border-radius:12px;background:#078575;color:#fff;font-weight:750;cursor:pointer}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="/auth.js?v=6.1" defer></script>
</head><body>
<main class="shell"><section class="panel">
<header><div class="logo">✦</div><h1>TemanChat</h1><p>Terhubung dengan orang terdekat</p></header>
<nav class="tabs" id="tabs"><button type="button" data-mode="login" class="on">Masuk</button><button type="button" data-mode="register">Daftar</button></nav>
<div class="alert" id="notice" role="status" aria-live="polite" hidden></div>
<form id="authForm">
<div id="registerFields" hidden><label for="displayName">Nama tampilan</label><input id="displayName" autocomplete="name" maxlength="60" placeholder="Nama kamu"><label for="username">Username unik</label><input id="username" autocomplete="username" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" placeholder="contoh: teman123"></div>
<div id="emailGroup"><label for="email">Alamat email</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="nama@email.com" required></div>
<div id="passwordGroup"><label for="password" id="passwordLabel">Password</label><div class="pw"><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="Minimal 8 karakter" required><button type="button" id="showPassword">Lihat</button></div></div>
<div id="turnstile" class="turnstile"></div><button type="submit" id="submitBtn" class="submit" disabled>Menyiapkan keamanan…</button>
</form>
<div class="extras"><button type="button" id="forgotBtn">Lupa password?</button><button type="button" id="resendBtn">Kirim ulang verifikasi</button></div>
<p class="footnote">Gunakan password unik minimal 8 karakter. Pendaftaran melalui email, tanpa kode undangan.</p>
</section></main>
</body></html>
