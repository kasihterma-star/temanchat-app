<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6555"><meta name="robots" content="noindex"><title>Masuk • TemanChat</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/auth.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><script src="/auth.js" defer></script></head><body>
<main class="shell"><section class="panel"><header><div class="logo">✦</div><h1>TemanChat</h1><p>Terhubung dengan orang terdekat</p></header>
<nav class="tabs" id="tabs"><button type="button" data-mode="login" class="on">Masuk</button><button type="button" data-mode="register">Daftar</button></nav>
<div class="alert" id="notice" role="status" aria-live="polite" hidden></div>
<form id="authForm"><div id="registerFields" hidden><label for="displayName">Nama tampilan</label><input id="displayName" maxlength="60" autocomplete="name" placeholder="Nama kamu"><label for="username">Username unik</label><input id="username" maxlength="24" autocomplete="username" placeholder="mis. teman123" pattern="[a-zA-Z0-9_]{3,24}"></div>
<div id="emailGroup"><label for="email">Alamat email</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="nama@gmail.com" required></div>
<div id="passwordGroup"><label for="password" id="passwordLabel">Password</label><div class="pw"><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="Minimal 8 karakter" required><button type="button" id="showPassword" aria-label="Tampilkan password">Lihat</button></div></div>
<div id="turnstile" class="turnstile"></div><button type="submit" id="submitBtn" class="submit" disabled>Menyiapkan keamanan…</button></form>
<div class="extras"><button type="button" id="forgotBtn">Lupa password?</button><button type="button" id="resendBtn">Kirim ulang verifikasi</button></div>
<p class="footnote">Chat dan telepon sungguhan masih tahap pengembangan. Akun ini untuk pengujian awal.</p></section></main></body></html>
