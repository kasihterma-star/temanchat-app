<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6555">
  <meta name="description" content="TemanChat — pesan, panggilan suara, dan video untuk teman dan keluarga">
  <title>TemanChat — Pesan</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=6.4">
  <link rel="stylesheet" href="/v6.css?v=6.4">
  <script src="/config.js?v=6.4" defer></script>
  <script src="/storage.js?v=6.4" defer></script>
  <script src="/app.js?v=6.4" defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar" class="sidebar mobile-visible">
    <div class="brand"><div class="brand-icon">✦</div><div><strong>TemanChat</strong><small>Terhubung dengan orang terdekat</small></div></div>
    <div class="mode" id="mode"><span class="dot"></span> Menghubungkan akun…</div>
    <div class="sidebar-title"><h2>Pesan</h2><button class="round" id="callHistoryBtn" title="Riwayat panggilan" aria-label="Riwayat panggilan">☎</button><button class="round" id="installBtn" title="Instal TemanChat" aria-label="Instal aplikasi">↓</button></div>
    <label class="search"><span>⌕</span><input id="search" placeholder="Cari teman lewat username…" autocomplete="off" aria-label="Cari teman"></label>
    <div id="contacts" class="contacts"><p class="tc-empty">Memuat percakapan…</p></div>
    <div class="profile"><div class="avatar self">T</div><div><b>TemanChat</b><small>Memeriksa sesi…</small></div><button class="round" id="settingsBtn" title="Pengaturan" aria-label="Pengaturan">⚙</button></div>
  </aside>
  <main id="conversation" class="conversation mobile-hidden">
    <header class="chathead">
      <button type="button" class="tc-back" id="backBtn" aria-label="Kembali ke daftar">‹</button>
      <div class="avatar teal" id="headAvatar">?</div>
      <div class="chat-person"><strong id="headName">Pilih teman</strong><small id="headStatus">Cari pengguna untuk mulai chat</small></div>
      <div class="head-actions">
        <button class="round" id="voiceBtn" title="Telepon suara" aria-label="Telepon suara">☎</button>
        <button class="round" id="videoBtn" title="Video call" aria-label="Video call">▣</button>
        <button class="round" id="moreBtn" title="Info percakapan" aria-label="Info percakapan">⋯</button>
      </div>
    </header>
    <section id="messages" class="messages" aria-label="Percakapan"><div class="day">Pilih teman untuk mulai</div></section>
    <form class="compose" id="messageForm">
      <button type="button" class="round" id="attachBtn" title="Kirim foto/video/file dari perangkat" aria-label="Lampiran">＋</button>
      <input id="attachmentInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,application/pdf" hidden>
      <input id="messageInput" maxlength="1000" placeholder="Tulis pesan…" autocomplete="off" disabled>
      <button class="send" type="submit" aria-label="Kirim pesan" disabled>➤</button>
    </form>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div class="modal-head"><div class="logo-large">✦</div><button class="round" id="closeModal" aria-label="Tutup">×</button></div><h2 id="modalTitle">TemanChat</h2><p id="modalDesc"></p><div id="modalContent"></div></dialog>
<dialog id="callDialog" class="call-dialog">
  <div class="call-screen">
    <div class="call-remote" id="callRemote"><div class="call-avatar" id="callAvatar">T</div><strong id="callName">Memanggil…</strong><small id="callState">Menghubungkan…</small></div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay muted playsinline></video>
    <div class="call-controls"><button type="button" id="acceptCall" class="call-accept" hidden>✓ Terima</button><button type="button" id="muteCall">🎙 Mikrofon</button><button type="button" id="cameraCall">▣ Kamera</button><button type="button" id="hangupCall" class="call-end">☎ Akhiri</button></div>
  </div>
</dialog>
</body>
</html>
