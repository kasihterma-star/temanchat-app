<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b6555"><meta name="description" content="TemanChat — aplikasi pesan dan panggilan untuk teman dan keluarga"><title>TemanChat — Pesan</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/v5.css"> <style>html:not(.tc-auth-ready) #app{visibility:hidden}</style><style>html:not(.tc-auth-ready) #app{visibility:hidden}</style></head><body>
<div id="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">✦</div><div><strong>TemanChat</strong><small>Terhubung dengan orang terdekat</small></div></div><div class="mode" id="mode"><span class="dot"></span> Pesan teks aktif · V5</div><div class="sidebar-title"><h2>Pesan</h2><button class="round" id="installBtn" title="Instal aplikasi" aria-label="Instal aplikasi">↓</button></div><label class="search"><span>⌕</span><input id="search" placeholder="Cari teman via username..." autocomplete="off"></label><div id="contacts" class="contacts"></div><div class="profile"><div class="avatar self">S</div><div><b>Saya</b><small>Akun terverifikasi</small></div><button class="round" id="settingsBtn" aria-label="Pengaturan">⚙</button></div></aside>
<main class="conversation"><header class="chathead"><div class="avatar teal" id="headAvatar">N</div><div class="chat-person"><strong id="headName">Pilih teman</strong><small><span class="dot"></span> Percakapan pribadi</small></div><div class="head-actions"><button class="round" id="voiceBtn" title="Telepon suara" aria-label="Telepon suara">☎</button><button class="round" id="videoBtn" title="Video call" aria-label="Video call">▣</button><button class="round" id="moreBtn" title="Informasi" aria-label="Informasi">⋯</button></div></header>
<section id="messages" class="messages" aria-label="Pesan"></section><form class="compose" id="messageForm"><button type="button" class="round" id="attachBtn" aria-label="Lampiran">＋</button><input id="messageInput" placeholder="Tulis pesan..." maxlength="1000" autocomplete="off"><button class="send" type="submit" aria-label="Kirim pesan">➤</button></form></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><dialog id="modal"><div class="modal-head"><div class="logo-large">✦</div><button class="round" id="closeModal" aria-label="Tutup">×</button></div><h2 id="modalTitle">TemanChat</h2><p id="modalDesc"></p><div id="modalContent"></div></dialog>
<script src="/app.js?v=5" defer></script></body></html>
